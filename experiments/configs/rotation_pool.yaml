# rotation_pool - the ONE manifest of the pool-3 rotation rescore (arXiv roadmap Phase 1).
# Design, pre-registration and sign-off: docs/plans/2026-09-20-rotation-pool-design.md (signed 2026-09-20).
# Everything the run depends on is here. The frozen-readout half is read by
# experiments/analyze_rotation_pool.py (constants mirrored there; this file is the record), the
# supervised half by swm.train.supervised at run time, and the runner is GENERATED by swm.exp.gen_supervised.
name: rotation_pool
plan: docs/plans/2026-09-20-rotation-pool-design.md
adr: docs/adr/0012-recipe-unfreeze-and-probe-boundary.md

# ------------------------------------------------------------------------------------------- rationale
# Pool 1 admits positives only through transit/eb/pulsating and its quiet stars match no catalogue, so
# all 1,138 of its rotation positives carry a second label and none of its quiet stars rotates: the
# ML4PS `rotation` and `rotation_period` rows can be won by detecting the co-occurring class.
# Pool 3 = every corpus star with windows outside pool 1. No transit/eb/pulsating positive exists in
# it, no star of it was seen in pre-training, and nothing is sampled (prevalence 0.130, corpus 0.125).
# NO encoder pass and NO pre-training: R8 cached pooled mu for all of it, T2 cached the 25 features.

# ------------------------------------------------------------------------------------------------ pool
pool:
  builder: python -m swm.eval.rotation_pool
  parquet: processed/subset/rotation_pool.parquet     # tic_id, split, stratum, no_flare, strict
  universe: corpus stars with windows MINUS pool 1 (processed/subset/subset_tics.parquet)
  positive: rotation == 1 (TARS)
  negative: rotation == 0 (absent from TARS -- NOT a confirmed non-rotator; see the TARS circularity note)
  split: {fractions: [0.70, 0.15, 0.15], seed: 0, tic_disjoint: true, strata: [rot_le5, rot_gt5, neg]}
  period_cap_days: 5.0                                # ADR-0004; one input sequence spans 5.69 d
  measured:                                           # 2026-09-20, from the builder's log
    n: 106284
    n_pos: 13789
    prevalence: 0.1297
    strata:
      rot_le5: {train: 6150, val: 1318, test: 1318}
      rot_gt5: {train: 3502, val: 750, test: 751}
      neg: {train: 64746, val: 13874, test: 13875}
  sensitivity:                                        # probe REFIT on the restricted train split
    no_flare: {rule: flare_ever == 0 in both classes, n_pos: 12359, n_neg: 92008}
    strict:
      rule: positives in no non-rotation catalogue, negatives in no catalogue at all, neither flaring
      n_pos: 12113
      n_neg: 82416

# ------------------------------------------------------------------------------------- frozen readouts
frozen:
  script: experiments/analyze_rotation_pool.py
  mu_cache: experiments/r8_fullpool/mu_cache          # read-only; <arm>/shard_*.npz = tics, mean, std, n_win
  features: experiments/r8_fullpool/features25        # 25 engineered features, arm-independent
  arms:
    hann0p3_fbwd: {r8_prefix: exp07_hann0p3_fbwd, seeds: [0, 1, 2, 3, 4, 5]}
    hann0p3_off: {r8_prefix: exp07_hann0p3_off, seeds: [0, 1, 2, 3, 4, 5]}
    untrained: {r8_prefix: untrained_i, inits: [0, 1, 2, 3, 4, 5], paper_arm: untrained_i0}
  arm_sets: [features_only, mu, features_plus_mu, mu_perp_full]
  readouts: {headline: mean, second: mean_std, appendix_mu_only: mean_perp_amp}
  families:
    linear: {classifier: logistic class_weight=balanced, regressor: RidgeCV, populations: all}
    xgb: {readout: mean, arm_sets: [features_only, mu, features_plus_mu], populations: [pool3]}
  tasks:
    rotation: {metric: pr_auc, population: all of pool 3}
    rotation_period: {metric: r2, population: rotation == 1 and P <= 5 d, target: linear days}
  contrasts:
    fusion_minus_features: paired per seed; spread is the mu side's alone under `linear`
    fusion_fbwd_minus_off: both arms' seed spreads (F17)
    fusion_trained_minus_untrained: seed s paired with init s (fixed before any score was read)
  bootstrap: per-star test scores dumped at `mean` for analyze_paper_bootstrap.py

footing:                                              # abort before any pool-3 number if one fails
  F1: {what: this code path on pool 1 reproduces Table 1, rotation: [0.540, 0.559, 0.555],
       rotation_period: [0.703, 0.677, 0.717], tol: 5.0e-4, result: "PASS 2026-09-20"}
  F2: {what: R8 untrained_i0 is the paper's untrained arm,
       result: "PASS 2026-09-20; max |diff| 5.2e-5 vs 2.0e-1 for a different init"}
  F3: {what: features25 equals pool 2's feature cache on shared stars,
       result: "PASS 2026-09-20; 17,604 stars, max |diff| 0.0"}
deviations:
  D1: "F2 was pre-registered as max |diff| = 0. Two extraction scripts with different batching are not
       bit-stable in float32 (a trained arm shows 2.7e-4 too), so the check is discriminative instead:
       i0 must match, and >= 100x better than i1. Found and fixed before any pool-3 score was read."

# ---------------------------------------------------------------- pre-registered reading (design s7, s11)
counts_rule:
  base: fusion_minus_features > 2 SE (linear, mean, hann0p3_fbwd, 6 seeds)
  rotation_rows_extra: untrained fusion gain NOT > 2 SE, AND fusion_trained_minus_untrained > 2 SE   # A2
k_rules:
  - "K1 the count lands on 6, 7 or 8; abstract and body take it mechanically"
  - "K2 untrained control: the 'never exceeds' sentence takes the new maximum"
  - "K3 a fusion gain changes sign, or features_only moves by more than 0.05"
  - "K4 fbwd - off changes sign against pool 1"
  - "K5 headline and a sensitivity row disagree on counting: stated in the body"
  - "K6 the XGBoost and C1/C2 tallies are recounted"
placement: decided by the user AFTER results (A1); the numbers are printed either way

# =====================================================================================================
# SUPERVISED HALF -- same schema as c1c2_supervised_baselines.yaml, same base, same two arms.
# Only the population changes. TRAINING: generated runner, handed to the user's terminal.
# =====================================================================================================
base:
  window: 256
  batch_stars: 64
  max_epochs: 60
  patience: 10
  lr: 0.0003
  weight_decay: 0.0001
  dropout: 0.2
  amp: true
  grad_clip: 1.0
  num_workers: 0
  z_dim: 128
  class_weighted: true
  select_on: metric
  flag_selected_epoch: [first, last]

arms:
  conv_supervised:
    roadmap_row: C1
    trunk: conv
    enc_channels: [32, 64, 128, 256]
    kernel_size: 5
    seeds: [0, 1, 2, 3, 4, 5]
  mlp_raw:
    roadmap_row: C2
    trunk: dense
    hidden: [256, 256]
    seeds: [0, 1, 2, 3, 4, 5]

tasks:
  - name: rotation
    block: pool3
    population: rotation_pool
    shape: detection
    metric: pr_auc
    label: {source: variability_labels_star, column: rotation, missing_is: 0}
    keep: all
    n: {train: 74398, val: 15942, test: 15944, pos_train: 9652, pos_val: 2068, pos_test: 2069}
  - name: rotation_period
    block: pool3
    population: rotation_pool
    shape: regression
    metric: r2
    target_transform: linear
    label: {source: variability_labels_star, column: rotation_period}
    keep: tars_rotator_le5d
    n: {train: 6150, val: 1318, test: 1318}

floors:
  pr_auc: prevalence
  roc_auc: 0.5
  r2: 0.0

queue:
  order: [rotation_period, rotation]     # the cheap task first: a broken harness shows in one minute
  arm_order: [conv_supervised, mlp_raw]
  pilot:
    arm: conv_supervised
    seed: 0
    tasks: all

pilot_gate:
  - both tasks strictly above their metric-native floor
  - no run with selected_epoch in {0, max_epochs - 1}

budget:
  pilot_minutes: 10            # ESTIMATE: pool-1 rotation took 0.90 min on 9,428 train stars; 74,398 here
  full_hours: 2.0              # ESTIMATE, 24 runs; replace with the measured value after the pilot
  note: "The first run also replays 106,284 stars from processed/sequences into data_cache (one-off)."

paths:
  root: experiments/rotation_pool/c1c2
  data_cache: experiments/rotation_pool/c1c2/data_cache
  runs: experiments/rotation_pool/c1c2/runs
  runner: experiments/run_rotation_pool_supervised.ps1
  frozen_probe_csv: experiments/rotation_pool/probe.csv
  frozen_summary_csv: experiments/rotation_pool/summary.csv
  frozen_absolute_csv: experiments/rotation_pool/absolute.csv
  star_scores: experiments/rotation_pool/star_scores.parquet

wandb:
  mode: online
  project: stellar-world-model
  group: rotation_pool_supervised
