lambda_dyn: 1.0 # dynamics-loss weight; the ONE knob that differs A vs B (overridden by variant group)
beta_target: 1.0 # final KL weight after warmup
beta_warmup_epochs: 10 # linear 0 --> beta_target over these epochs (anti posterior-collapse)
free_bits: 0.1 # nats per latent dim; KL floor so dims cannot collapse. Keep floor (0.1*z) below true KL so KL stays active (0.5 made the floor 64 > true KL ~36 -> KL gradient dead).
lr: 0.0003
lr_schedule: none # none | cosine (exp05). none = fixed lr (exp00-04 unchanged); cosine = CosineAnnealingLR over max_epochs
lr_min: 3.0e-6 # cosine eta_min floor; inert when lr_schedule=none
max_epochs: 100
patience: 15 # early-stop after this many epochs without val_total improvement
grad_clip: 1.0 # max grad norm (GRU stability)
amp: true # mixed precision; near-essential on 8GB
accum_steps: 1 # gradient accumulation; raise instead of forcing a larger batch
active_unit_kl_threshold: 0.01 # a latent dim counts as "active" if its per-dim KL exceeds this (nats)
resume: true # resume from last.pt if present
track_recon_aux_best: false # exp03 dual checkpoint: also save best_recon_aux.pt on the KL-free metric recon + w*aux + lambda*dyn; false reproduces exp00-02 selection exactly
track_recon_only_best: false # exp09 THIRD checkpoint: also save best_recon_only.pt on the AUX-INDEPENDENT metric recon + lambda*dyn. exp09's sweep axis is the aux term, so an aux-bearing selector would confound the axis with the selection rule (same problem select_include_dyn solves on the dynamics axis). false reproduces exp00-08 exactly
select_include_dyn: true # include lambda*dyn in the best_recon_aux selection metric; true reproduces exp00-04. exp05 sets false so mu is selected lambda-independently (apples-to-apples across the dynamics axis)
impulse_penalty_weight: 0.0 # exp09: weight on the residual excess-kurtosis penalty (losses.impulse_penalty_loss). Own weight and own logged channel (train/imp, val/imp) so it never contaminates val/aux. 0.0 = inert
augment: # exp09 input augmentation; all-zero defaults leave exp00-08 bit-identical
  hf_noise_sigma: 0.0 # band-limited HF noise amplitude in MAD units (flux is per-segment MAD-normalised). TRAIN SPLIT ONLY -- noising val would make val/recon incomparable across cells. 0.0 = off
  hf_noise_min_uhz: 1000.0 # noise only ABOVE this frequency. 1 mHz keeps the 65-260 uHz pulsator band provably untouched (df = 32.55 uHz at window 256, so the cut is bin 31)
recon_aux: # auxiliary reconstruction objective (exp02 sweep); default type=none/weight=0 keeps exp00/exp01 unchanged
  type: none # none | log_psd | hf_time | combined | masked
  weight: 0.0 # weight on the aux term; order-matched to the time-MSE scale per variant from smoke magnitudes
  psd_normalize: false # log_psd/combined: false=amplitude-retaining raw power, true=sum-1 spectral shape
  psd_eps: 1.0e-8 # floor inside log(power + eps) for the spectral term
  psd_window: none # log_psd/combined: none=rectangular FFT (exp00-06 unchanged) | hann=symmetric taper, zero at endpoints (exp07 edge fix) | dpss=Slepian multitaper family, no single cheapest impulse position (exp09; Hann RELOCATED the impulse rather than removing it, F27)
  psd_taper_nw: 4.0 # dpss only: time-bandwidth product. Inert for none/hann
  psd_taper_k: 7 # dpss only: number of tapers, standard K <= 2*NW-1. log-PSD MSE is averaged over them. Inert for none/hann
  spectral_floor: null # exp09 aux_clip: clamp the SPECTRAL SUB-TERM from below, so there is no gradient reward for driving it under a value only reachable by planting an impulse. Applies to the spectral piece alone (C1: hf_time moved only -0.5..-4% under the same ablation). null = off. MEASURE it (roadmap Y9-F), never guess
  hf_weight: 1.0 # combined only: weight of the hf_time sub-term relative to the log_psd sub-term
  mask_frac: 0.0 # masked only: fraction of each window's timesteps corrupted to zero
  mask_span: 8 # masked only: contiguous span length (cadences) per corrupted block
wandb:
  mode: online # online | offline | disabled
  project: stellar-world-model
  entity: null # null --> default entity from `wandb login`
